<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Wishlist 3 Tahun</title>
    <style>
        /* Gaya Visual Gaming (Dark Mode & Neon) */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            color: #00ffcc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffcc;
            box-shadow: 0 0 20px #00ffcc;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 { text-transform: uppercase; letter-spacing: 3px; font-size: 1.5rem; }

        .input-group { margin: 20px 0; text-align: left; }

        label { display: block; margin-bottom: 5px; color: #ff00ff; font-weight: bold; }

        textarea {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #00ffcc;
            color: white;
            border-radius: 5px;
            resize: none;
            box-sizing: border-box;
        }

        .btn-container { display: flex; gap: 10px; margin-top: 20px; }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-save { background: #00ffcc; color: #000; }
        .btn-save:hover { background: #00ccaa; box-shadow: 0 0 10px #00ffcc; }

        .btn-share { background: #25d366; color: white; }
        .btn-share:hover { background: #128c7e; box-shadow: 0 0 10px #25d366; }

        .status { margin-top: 10px; font-size: 0.8rem; color: #aaa; }
    </style>
</head>
<body>

<div class="container">
    <h1>Level Up: 3 Year Goals</h1>
    <p>Tuliskan quest/harapanmu untuk 3 tahun ke depan!</p>

    <div class="input-group">
        <label>Tahun 1 (2024-2025):</label>
        <textarea id="year1" rows="3" placeholder="Contoh: Rakit PC High-End..."></textarea>
    </div>

    <div class="input-group">
        <label>Tahun 2 (2025-2026):</label>
        <textarea id="year2" rows="3" placeholder="Contoh: Menjadi Streamer Sukses..."></textarea>
    </div>

    <div class="input-group">
        <label>Tahun 3 (2026-2027):</label>
        <textarea id="year3" rows="3" placeholder="Contoh: Masuk Tim E-Sports Profesional..."></textarea>
    </div>

    <div class="btn-container">
        <button class="btn-save" onclick="saveData()">Save Progress</button>
        <button class="btn-share" onclick="shareWA()">Share to WA</button>
    </div>

    <p class="status" id="statusText">Data tersimpan otomatis di browser ini.</p>
</div>

<script>
    // Memuat data yang tersimpan saat halaman dibuka
    window.onload = function() {
        document.getElementById('year1').value = localStorage.getItem('wish_y1') || "";
        document.getElementById('year2').value = localStorage.getItem('wish_y2') || "";
        document.getElementById('year3').value = localStorage.getItem('wish_y3') || "";
    };

    // Fungsi menyimpan ke LocalStorage
    function saveData() {
        const y1 = document.getElementById('year1').value;
        const y2 = document.getElementById('year2').value;
        const y3 = document.getElementById('year3').value;

        localStorage.setItem('wish_y1', y1);
        localStorage.setItem('wish_y2', y2);
        localStorage.setItem('wish_y3', y3);

        const status = document.getElementById('statusText');
        status.innerText = "Checkpointed! Harapan berhasil disimpan.";
        status.style.color = "#00ffcc";
        
        setTimeout(() => {
            status.innerText = "Data tersimpan otomatis di browser ini.";
            status.style.color = "#aaa";
        }, 3000);
    }

    // Fungsi membagikan ke WhatsApp
    function shareWA() {
        const y1 = document.getElementById('year1').value;
        const y2 = document.getElementById('year2').value;
        const y3 = document.getElementById('year3').value;

        if(!y1 && !y2 && !y3) {
            alert("Tuliskan dulu harapanmu sebelum berbagi!");
            return;
        }

        const text = `*🎮 MY 3-YEAR GAMING GOALS 🎮*%0A%0A` +
                     `*Tahun 1:* ${y1}%0A` +
                     `*Tahun 2:* ${y2}%0A` +
                     `*Tahun 3:* ${y3}%0A%0A` +
                     `_Dikirim via Gaming Wishlist App_`;

        window.open(`https://wa.me/?text=${text}`, '_blank');
    }
</script>

</body>
</html>
